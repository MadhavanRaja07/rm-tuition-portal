<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - RM TUITION CENTER</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-card auth-card text-center" style="max-width: 500px;">
      <div class="auth-logo">
        <h1>Create Account</h1>
        <p>Register as a student to access resources</p>
      </div>
      
      <div id="alert-container"></div>
      
      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="input-control" placeholder="John Doe" required autocomplete="name">
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="input-control" placeholder="john@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="input-control" placeholder="+91 98765 43210" required autocomplete="tel">
        </div>
        
        <div class="form-group">
          <label for="standard">Academic Standard / Class</label>
          <select id="standard" class="input-control" required>
            <option value="" disabled selected>Select your class</option>
            <option value="10">10th Standard</option>
            <option value="11-all">11th – All Subjects</option>
            <option value="11-pcm">11th – PCM (Physics, Chemistry, Maths)</option>
            <option value="11-pc">11th – PC (Physics, Chemistry)</option>
            <option value="11-maths">11th – Maths Only</option>
            <option value="12-all">12th – All Subjects</option>
            <option value="12-pcm">12th – PCM (Physics, Chemistry, Maths)</option>
            <option value="12-pc">12th – PC (Physics, Chemistry)</option>
            <option value="12-maths">12th – Maths Only</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="input-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-4">Sign Up</button>
      </form>
      
      <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="/login.html" style="color: var(--accent-violet); text-decoration: none; font-weight: 600;">Sign In here</a>
      </p>
    </div>
  </div>
  
  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
