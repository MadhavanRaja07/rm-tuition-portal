<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - RM TUITION CENTER</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-card auth-card text-center">
      <div class="auth-logo">
        <h1>Create New Password</h1>
        <p>Set a secure password for your account</p>
      </div>
      
      <div id="alert-container"></div>
      
      <form id="reset-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="input-control" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="input-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-4">Save Password</button>
      </form>
    </div>
  </div>
  
  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
