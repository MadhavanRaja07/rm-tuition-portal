<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Attempt - RM TUITION CENTER</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .quiz-container {
      width: 100%;
      max-width: 700px;
    }
  </style>
</head>
<body>
  <div class="glass-card quiz-container" id="quiz-workspace">
    <div id="quiz-loading" class="text-center">
      <h3>Loading Quiz Questions...</h3>
      <p>Please wait, initializing connection.</p>
    </div>
    
    <div id="quiz-active" class="hidden">
      <!-- Quiz Header Info -->
      <div class="quiz-header">
        <div>
          <span class="badge badge-violet" id="quiz-subject">Subject</span>
          <h2 id="quiz-title" style="margin-top: 0.5rem;">Quiz Title</h2>
        </div>
        <div class="quiz-timer">
          <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin='round' stroke-width='2' d='M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z'></path></svg>
          <span id="timer-display">00:00</span>
        </div>
      </div>
      
      <!-- Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="quiz-progress"></div>
      </div>
      
      <!-- Question Container -->
      <div class="quiz-question-card">
        <h4 id="question-number" style="color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 500;">Question 1 of 5</h4>
        <h3 id="question-text">Question prompt goes here?</h3>
        
        <div class="quiz-options" id="options-container">
          <!-- Options dynamically loaded -->
        </div>
      </div>
      
      <!-- Buttons Controls -->
      <div class="flex justify-between mt-4">
        <button class="btn btn-secondary" id="btn-prev" disabled>Previous</button>
        <button class="btn btn-primary" id="btn-next">Next Question</button>
      </div>
    </div>

    <!-- Success Container -->
    <div id="quiz-success" class="hidden text-center">
      <div style="background: rgba(16, 185, 129, 0.15); width:70px; height:70px; border-radius:50%; color:var(--success); display:inline-flex; align-items:center; justify-content:center; margin-bottom:1.5rem;">
        <svg style="width:40px;height:40px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin='round' stroke-width='3' d='M5 13l4 4L19 7'></path></svg>
      </div>
      <h2 class="mb-4">Attempt Submitted Successfully!</h2>
      <p style="color:var(--text-secondary); margin-bottom:2rem;" id="quiz-success-msg">Your attempt has been submitted. Score reviews will be visible once the teacher releases the results.</p>
      <button class="btn btn-primary" onclick="window.location.replace('/student/dashboard.html#results')">Go to Results</button>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script>
    // Single page quiz attempt engine
    const authInfo = checkAuth('ROLE_STUDENT');
    if (!authInfo) {
      // redirected by checkAuth
    }

    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('id');

    if (!quizId) {
      window.location.replace('/student/dashboard.html');
    }

    let quizData = null;
    let studentAnswers = {}; // questionIndex -> selectedOptionIndex
    let currentQuestionIndex = 0;
    let timerInterval = null;
    let secondsRemaining = 0;

    document.addEventListener('DOMContentLoaded', () => {
      if (authInfo) {
        loadQuiz();
      }
    });

    async function loadQuiz() {
      try {
        const res = await fetchAPI(`/api/student/quizzes/${quizId}`);
        if (!res) return;
        
        if (res.ok) {
          quizData = await res.json();
          initializeQuiz();
        } else {
          const err = await res.json();
          alert(err.message || 'Access denied.');
          window.location.replace('/student/dashboard.html');
        }
      } catch (e) {
        alert('Network connection error.');
        window.location.replace('/student/dashboard.html');
      }
    }

    function initializeQuiz() {
      document.getElementById('quiz-loading').classList.add('hidden');
      document.getElementById('quiz-active').classList.remove('hidden');
      
      document.getElementById('quiz-title').textContent = quizData.title;
      document.getElementById('quiz-subject').textContent = quizData.subject;
      
      // Start Timer
      secondsRemaining = quizData.durationMinutes * 60;
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();
        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          submitQuiz(true); // Auto submit on timeout
        }
      }, 1000);
      
      renderQuestion();
      
      // Hook Buttons
      document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
          currentQuestionIndex--;
          renderQuestion();
        }
      });
      
      document.getElementById('btn-next').addEventListener('click', () => {
        if (currentQuestionIndex < quizData.questions.length - 1) {
          currentQuestionIndex++;
          renderQuestion();
        } else {
          // Submit clicked
          if (confirm('Are you sure you want to submit your quiz answers?')) {
            submitQuiz(false);
          }
        }
      });
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsRemaining / 60);
      const secs = secondsRemaining % 60;
      document.getElementById('timer-display').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      // Add red pulse warning when less than 1 minute remains
      if (secondsRemaining < 60) {
        document.querySelector('.quiz-timer').style.background = 'rgba(239, 68, 68, 0.2)';
        document.querySelector('.quiz-timer').style.color = 'var(--error)';
      }
    }

    function renderQuestion() {
      const question = quizData.questions[currentQuestionIndex];
      const totalQs = quizData.questions.length;
      
      // Update Index Text
      document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1} of ${totalQs}`;
      document.getElementById('question-text').textContent = question.questionText;
      
      // Update progress bar
      const progressPercent = ((currentQuestionIndex) / totalQs) * 100;
      document.getElementById('quiz-progress').style.width = `${progressPercent}%`;
      
      // Options list
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      
      question.options.forEach((opt, oIdx) => {
        const label = document.createElement('label');
        label.className = `option-label ${studentAnswers[currentQuestionIndex] === oIdx ? 'selected' : ''}`;
        
        label.innerHTML = `
          <input type="radio" name="quiz-opt" value="${oIdx}" ${studentAnswers[currentQuestionIndex] === oIdx ? 'checked' : ''} onchange="selectOption(${oIdx})">
          <div class="option-marker">${String.fromCharCode(65 + oIdx)}</div>
          <span>${opt}</span>
        `;
        container.appendChild(label);
      });
      
      // Toggle button states
      document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
      
      const btnNext = document.getElementById('btn-next');
      if (currentQuestionIndex === totalQs - 1) {
        btnNext.textContent = 'Submit Quiz';
        btnNext.classList.remove('btn-primary');
        btnNext.classList.add('btn-success');
      } else {
        btnNext.textContent = 'Next Question';
        btnNext.classList.remove('btn-success');
        btnNext.classList.add('btn-primary');
      }
    }

    function selectOption(oIdx) {
      studentAnswers[currentQuestionIndex] = oIdx;
      // Re-render choices to draw border highlights
      document.querySelectorAll('.option-label').forEach((el, index) => {
        if (index === oIdx) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
    }

    async function submitQuiz(isTimeout = false) {
      clearInterval(timerInterval);
      document.getElementById('quiz-active').classList.add('hidden');
      document.getElementById('quiz-loading').classList.remove('hidden');
      document.getElementById('quiz-loading').querySelector('h3').textContent = 'Submitting your attempt...';
      
      try {
        const res = await fetchAPI(`/api/student/quizzes/${quizId}/attempt`, {
          method: 'POST',
          body: JSON.stringify(studentAnswers)
        });
        
        document.getElementById('quiz-loading').classList.add('hidden');
        document.getElementById('quiz-success').classList.remove('hidden');
        
        if (isTimeout) {
          document.getElementById('quiz-success-msg').innerHTML = 
            '<strong>Time ran out!</strong> Your partial answers were automatically recorded and submitted.';
        }
      } catch (err) {
        alert('Failed to submit attempt due to connection error.');
        window.location.replace('/student/dashboard.html');
      }
    }
  </script>
</body>
</html>
