<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - RM TUITION CENTER</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-card auth-card text-center">
      <div class="auth-logo">
        <h1>Reset Password</h1>
        <p>Enter your email to receive a password reset link</p>
      </div>
      
      <div id="alert-container"></div>
      
      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="input-control" placeholder="name@domain.com" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-4">Send Reset Link</button>
      </form>
      
      <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Back to <a href="/login.html" style="color: var(--accent-violet); text-decoration: none; font-weight: 600;">Sign In</a>
      </p>
    </div>
  </div>
  
  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
