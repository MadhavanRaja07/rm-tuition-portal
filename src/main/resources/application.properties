# Application Server Settings
server.port=8080

# Spring Security Config (to prevent default password generation)
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
# For local MongoDB, uncomment below:
spring.data.mongodb.uri=mongodb://localhost:27017/rm_tuition_db
# For MongoDB Atlas, use: spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.mongodb.net/rm_tuition_db

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
rmtuition.app.jwtSecret=RM_Tuition_Center_Super_Secure_Secret_Key_For_JWT_Authentication_2026_07_10
rmtuition.app.jwtExpirationMs=86400000

# Mail Configuration (Gmail SMTP or Resend SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=madhavanraja.tution@gmail.com
spring.mail.password=your_smtp_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI API Key for Quiz Generation
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
